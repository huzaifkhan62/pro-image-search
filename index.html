<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Vision | AI Image Search</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="splash-screen">
    <div class="splash-content">
        <h1 class="splash-logo">PRO<span>VISION</span></h1>
        <p class="created-by">Created by <span>HUZAIFKHAN</span></p>
    </div>
    </div>
    <div id="auth-overlay">
    <div class="auth-box">
        <h2>Welcome to <span>Pro Vision</span></h2>
        <div class="auth-inputs">
            <input type="email" id="emailInput" placeholder="Email Address">
            <input type="password" id="passwordInput" placeholder="Password (min 6 chars)">
        </div>
        <div class="auth-buttons">
            <button id="loginBtn">Login</button>
            <button id="signupBtn" class="secondary">Sign Up</button>
        </div>
        <p id="authError"></p>
        <button id="logoutBtn" style="display:none;">Logout</button>
    </div>
    </div>
    <div class="app-container" id="main-app" style="display: none;">
        <header>
            <div class="theme-switch-wrapper" style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
    <input type="checkbox" id="checkbox" style="width:20px; height:20px; cursor:pointer;">
    <span style="color:white; font-size:14px;">Dark Mode</span>
            </div> 
        <h1 class="logo">PRO<span>VISION</span></h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search HD Wallpapers, Anime, Art...">
                <button id="searchBtn">🔍</button>
            </div>
            <div class="categories">
                <button onclick="searchCategory('Nature')">Nature</button>
                <button onclick="searchCategory('Anime')">Anime</button>
                <button onclick="searchCategory('Cars')">Cars</button>
                <button onclick="searchCategory('Space')">Space</button>
            </div>
            <button onclick="showMyFavs()" id="fav-view-btn" style="background:#ff4757; color:white; border:none; padding:8px 15px; border-radius:20px; margin:10px auto; display:block; cursor:pointer; font-weight:bold;">My Favorites ❤️</button>
        </header>

        <main id="imageGrid" class="image-grid">
            <div class="loader">Search something amazing...</div>
        </main>
    </div>
    <script type="module" src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
